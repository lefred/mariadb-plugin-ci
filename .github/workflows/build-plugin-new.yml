name: Build MariaDB plugin (Foundry-style)

on:
  workflow_call:
    inputs:
      test_suites:
        description: mtr suite names to run
        required: false
        default: ""
        type: string

      artifact_retention_days:
        description: Number of days to retain workflow artifacts
        required: false
        default: 14
        type: number

      mariadb_versions:
        description: Versions (tarbuldnum or X.Y[.Z]) - whitespace-separated or a JSON array
        required: true
        type: string

      package_formats:
        description: Package formats to produce (deb, rpm, tgz) - whitespace-separated
        required: false
        default: deb rpm tgz
        type: string

      almalinux_version:
        description: AlmaLinux major version used to build the RPM (8, 9 or 10)
        required: false
        default: "9"
        type: string

      extra_packages_deb:
        description: Optional additional apt package names to install on Ubuntu before building (space-separated); prefer baking dependencies into the image
        required: false
        default: ""
        type: string

      extra_packages_rpm:
        description: Optional additional dnf package names to install on AlmaLinux before building (space-separated); package names may differ from extra_packages_deb
        required: false
        default: ""
        type: string

      allow_partial_release:
        description: Publish a release with the packages that succeeded even if some builds failed
        required: false
        default: false
        type: boolean

      parallel:
        description: Parallel threads for builds
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      ubuntu_formats: ${{ steps.matrix.outputs.ubuntu_formats }}
      rpm: ${{ steps.matrix.outputs.rpm }}
    steps:
      - id: matrix
        name: Validate MariaDB versions and package formats
        env:
          VERSIONS: ${{ inputs.mariadb_versions }}
          PACKAGE_FORMATS: ${{ inputs.package_formats }}
          ALMALINUX_VERSION: ${{ inputs.almalinux_version }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          raw = os.environ['VERSIONS'].strip()
          versions = json.loads(raw) if raw.startswith('[') else raw.split()
          if not isinstance(versions, list) or not versions or len(versions) > 256:
              raise SystemExit('mariadb_versions must contain 1..256 versions')
          matrix = []
          for version in versions:
              if not isinstance(version, (int, str)):
                  raise SystemExit('mariadb_versions entries must be strings or integers')
              value = str(version)
              if not re.fullmatch(r'[0-9]+|[0-9]+\.[0-9]+(\.[0-9]+)?', value):
                  raise SystemExit('Use autobake build IDs or MariaDB releases such as 1234, 11.4, or 11.8.2')
              row = {'mariadb_version': value}
              if row not in matrix:
                  matrix.append(row)
          formats = os.environ['PACKAGE_FORMATS'].split()
          if not formats or any(f not in ('deb', 'rpm', 'tgz') for f in formats):
              raise SystemExit('package_formats must list deb, rpm and/or tgz')
          if 'rpm' in formats and os.environ['ALMALINUX_VERSION'] not in ('8', '9', '10'):
              raise SystemExit('almalinux_version must be 8, 9 or 10')
          ubuntu_formats = [f for f in ('deb', 'tgz') if f in formats]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': matrix}) + '\n')
              output.write('ubuntu_formats=' + ' '.join(ubuntu_formats) + '\n')
              output.write('rpm=' + str('rpm' in formats).lower() + '\n')
          PYTHON

  build:
    name: deb/tgz - MariaDB ${{ matrix.mariadb_version }}
    needs: versions
    if: ${{ needs.versions.outputs.ubuntu_formats != '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    env:
      MARIADB_VERSION: ${{ matrix.mariadb_version }}
    steps:
      # The runner's Ubuntu mirror (azure.archive.ubuntu.com) can stop
      # resolving for hours, failing every apt-get.  ci-apt keeps apt on the
      # Ubuntu mirrors that answer and, when apt fails to fetch from one,
      # drops it and retries on the next.  Other apt failures are not retried.
      - name: Install ci-apt
        run: |
          set -euo pipefail
          sudo rm -f /var/tmp/ci-apt.excluded /var/tmp/ci-apt.ready
          sudo tee /usr/local/bin/ci-apt >/dev/null <<'CIAPT'
          #!/usr/bin/env bash
          # ci-apt <apt-get arguments>, e.g. ci-apt update, ci-apt install -y -- pkg
          set -uo pipefail
          candidates=(
            http://azure.archive.ubuntu.com/ubuntu/
            http://archive.ubuntu.com/ubuntu/
            http://us.archive.ubuntu.com/ubuntu/
            http://mirrors.edge.kernel.org/ubuntu/
            http://mirrors.mit.edu/ubuntu/
          )
          list=/etc/apt/apt-mirrors.txt
          excluded=/var/tmp/ci-apt.excluded
          ready=/var/tmp/ci-apt.ready
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")

          # Write the candidates that serve this release as apt's mirror list,
          # with priorities so apt tries them in this order; 1 when none does
          # (the list is then left as it is)
          pick() {
            local m ok=() i=0
            for m in "${candidates[@]}"; do
              grep -qxF "$m" "$excluded" 2>/dev/null && continue
              if curl -fsSL --connect-timeout 5 --max-time 20 -o /dev/null "${m}dists/${codename}/InRelease" &&
                 curl -fsSL --connect-timeout 5 --max-time 20 -o /dev/null "${m}dists/${codename}-security/InRelease"; then
                ok+=("$m")
              else
                echo "ci-apt: $m does not answer, skipped" >&2
              fi
            done
            (( ${#ok[@]} )) || { echo "ci-apt: no Ubuntu mirror answers" >&2; return 1; }
            for m in "${ok[@]}"; do printf '%s\tpriority:%d\n' "$m" $((++i)); done |
              sudo tee "$list" >/dev/null
            echo "ci-apt: Ubuntu mirrors: ${ok[*]}" >&2
          }

          # The candidate apt failed to fetch from, per the fetch errors in
          # its output $1 ("Temporary failure resolving 'host'", "Failed to
          # fetch http://host/...", "Could not connect to host:80"); the first
          # listed mirror when they name only the mirror list; nothing when no
          # Ubuntu fetch failed (other errors and warnings are not ours)
          failed_mirror() {
            local m host errors
            errors=$(grep -E 'Failed to fetch|Temporary failure resolving|Could not (resolve|connect)|Unable to connect|Connection (failed|timed out)|Hash Sum mismatch|404 +Not Found' "$1")
            [[ -n $errors ]] || return 0
            for m in "${candidates[@]}"; do
              host=${m#http://}; host=${host%%/*}
              grep -qE "(//|'| )${host//./\\.}([/':]| |$)" <<<"$errors" && { echo "$m"; return; }
            done
            if grep -qF "mirror+file:$list" <<<"$errors"; then
              head -n1 "$list" | cut -f1
            fi
          }

          # First call: pick the mirrors (again on later calls while none answered)
          if [[ ! -f $ready ]]; then
            if pick; then
              sudo touch "$ready"
              # Route plain Ubuntu sources through the list (the runner image
              # already does)
              for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
                [[ -f $f ]] || continue
                sudo sed -i -E "s#https?://([a-z0-9.-]+\.)?(archive|security)\.ubuntu\.com/ubuntu/?#mirror+file:$list#g" "$f"
              done
              [[ ${1:-} == update ]] || sudo apt-get update
            fi
          fi

          out=$(mktemp)
          trap 'rm -f "$out"' EXIT
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 "$@" 2>&1 | tee "$out"
            status=${PIPESTATUS[0]}
            bad=$(failed_mirror "$out")
            # apt-get update exits 0 when a source failed; count that too
            [[ $status -ne 0 || ${1:-} == update && -n $bad ]] || exit 0
            [[ -n $bad ]] || exit "$status"
            (( attempt < 3 )) || break
            # Still failing on a mirror already dropped: picking again won't help
            grep -qxF "$bad" "$excluded" 2>/dev/null && break
            echo "ci-apt: apt failed on $bad (attempt $attempt), dropping it" >&2
            echo "$bad" | sudo tee -a "$excluded" >/dev/null
            pick || break
            [[ ${1:-} == update ]] || sudo apt-get update
          done
          (( status )) || status=100
          exit "$status"
          CIAPT
          sudo chmod 755 /usr/local/bin/ci-apt

      - name: Install the SDK
        run: |
          set -euo pipefail
          if [[ "$MARIADB_VERSION" =~ ^[0-9]+$ ]]; then
            curl --fail --location \
              "https://ci.mariadb.org/$MARIADB_VERSION/amd64-ubuntu-2404-deb-autobake/mariadb.sources" |
              sudo tee /etc/apt/sources.list.d/mariadb.sources >/dev/null
          elif [[ "$MARIADB_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            cat <<EOF | sudo tee /etc/apt/sources.list.d/mariadb.sources >/dev/null
          X-Repolib-Name: MariaDB
          Types: deb
          URIs: https://archive.mariadb.org/mariadb-$MARIADB_VERSION/repo/ubuntu
          Suites: noble
          Trusted: yes
          EOF
          fi
          ci-apt update
          ci-apt install -y -- libmariadb-dev gcc g++ dpkg-dev file lsb-release

      - name: Install optional plugin dependencies
        env:
          EXTRA_PACKAGES: ${{ inputs.extra_packages_deb }}
        run: |
          set -euo pipefail
          if [[ -n "$EXTRA_PACKAGES" ]]; then
            read -r -a packages <<< "$EXTRA_PACKAGES"
            ci-apt install -y -- "${packages[@]}"
          fi

      - name: Check out plugin repository at triggering commit
        uses: actions/checkout@v5
        with:
          path: plugin-source
          submodules: recursive

      - name: Build plugin packages
        env:
          PACKAGE_FORMATS: ${{ needs.versions.outputs.ubuntu_formats }}
        run: |
          set -euo pipefail
          read -ra formats <<< "$PACKAGE_FORMATS"
          mkdir -p dist
          for format in "${formats[@]}"; do
            case "$format" in
              deb) options=(-DDEB=1); pattern='*.deb' ;;
              # Setting INSTALL_SYSCONFDIR skips the SDK's STANDALONE fallback,
              # which also sets INSTALL_SYSCONF2DIR to etc/my.cnf.d: a tarball
              # then has no my.cnf.d file loading the plugin at startup.
              tgz) options=(-DINSTALL_SYSCONFDIR=etc); pattern='*.tar.gz' ;;
              *) echo "::error::Unknown package format: $format"; exit 1 ;;
            esac
            echo "::group::Build $format package"
            cmake -S plugin-source -B "build-$format" "${options[@]}"
            cmake --build "build-$format" --target package --parallel ${{ inputs.parallel }} 
            echo "::endgroup::"
            mapfile -t packages < <(find "build-$format" -maxdepth 1 -type f -name "$pattern")
            (( ${#packages[@]} )) || { echo "::error::No $format package produced"; exit 1; }
            cp -- "${packages[@]}" dist/
          done
          cd dist
          for package in *; do
            sha256sum -- "$package" > "$package.sha256"
          done
          ls -l

      - name: Run MTR using prebuilt runtime
        if: ${{ inputs.test_suites }}
        env:
          TEST_SUITES: ${{ inputs.test_suites }}
        run: |
          set -euo pipefail
          compgen -G 'dist/*.deb' >/dev/null || { echo '::error::MTR needs the deb package format'; exit 1; }
          ci-apt install -y ./dist/*.deb
          ci-apt install -y mariadb-test mariadb-test-data
          cd /usr/share/mariadb/mariadb-test
          ./mtr --suites "$TEST_SUITES" --force --verbose-restart --retry=1 --vardir="$HOME"/var

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: mariadb-plugin-${{ matrix.mariadb_version }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

  rpm:
    name: rpm (el${{ inputs.almalinux_version }}) - MariaDB ${{ matrix.mariadb_version }}
    needs: versions
    if: ${{ needs.versions.outputs.rpm == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: almalinux:${{ inputs.almalinux_version }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    env:
      MARIADB_VERSION: ${{ matrix.mariadb_version }}
      EL_VERSION: ${{ inputs.almalinux_version }}
    steps:
      - name: Install the SDK
        run: |
          set -euo pipefail
          if [[ "$MARIADB_VERSION" =~ ^[0-9]+$ ]]; then
            curl --fail --location \
              "https://ci.mariadb.org/$MARIADB_VERSION/amd64-rhel-$EL_VERSION-rpm-autobake/MariaDB.repo" \
              > /etc/yum.repos.d/MariaDB.repo
          else
            cat > /etc/yum.repos.d/MariaDB.repo <<EOF
          [MariaDB]
          name=MariaDB $MARIADB_VERSION
          baseurl=https://archive.mariadb.org/mariadb-$MARIADB_VERSION/yum/rhel/$EL_VERSION/x86_64
          gpgcheck=0
          EOF
          fi
          # Let the MariaDB repository override AppStream's mariadb module.
          echo 'module_hotfixes=1' >> /etc/yum.repos.d/MariaDB.repo
          dnf install -y epel-release
          dnf install -y MariaDB-devel cmake gcc gcc-c++ make rpm-build git file

      - name: Install optional plugin dependencies
        env:
          EXTRA_PACKAGES: ${{ inputs.extra_packages_rpm }}
        run: |
          set -euo pipefail
          if [[ -n "$EXTRA_PACKAGES" ]]; then
            read -r -a packages <<< "$EXTRA_PACKAGES"
            dnf install -y -- "${packages[@]}"
          fi

      - name: Check out plugin repository at triggering commit
        uses: actions/checkout@v5
        with:
          path: plugin-source
          submodules: recursive

      - name: Build RPM package
        run: |
          set -euo pipefail
          cmake -S plugin-source -B build-rpm -DRPM=1
          cmake --build build-rpm --target package --parallel ${{ inputs.parallel }} 
          mkdir -p dist
          mapfile -t packages < <(find build-rpm -maxdepth 1 -type f -name '*.rpm')
          (( ${#packages[@]} )) || { echo '::error::No rpm package produced'; exit 1; }
          cp -- "${packages[@]}" dist/
          cd dist
          for package in *.rpm; do
            sha256sum -- "$package" > "$package.sha256"
            rpm -qpil --requires -- "$package"
          done

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: mariadb-plugin-${{ matrix.mariadb_version }}-el${{ inputs.almalinux_version }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

  release:
    name: Publish GitHub Release
    # deb/tgz and rpm jobs are each optional (package_formats); publish when
    # at least one produced packages and none failed, or, with
    # allow_partial_release, with whatever packages were produced.
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v')
          && (inputs.allow_partial_release
              || ((needs.build.result == 'success' || needs.rpm.result == 'success')
                  && !contains(needs.*.result, 'failure'))) }}
    needs:
      - build
      - rpm
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
          pattern: mariadb-plugin-*

      - name: Verify release assets
        run: |
          set -euo pipefail
          cd release-assets
          ls -l
          packages=$(find . -maxdepth 1 -type f ! -name '*.sha256' | wc -l)
          checksums=$(find . -maxdepth 1 -type f -name '*.sha256' | wc -l)
          (( packages > 0 )) || { echo '::error::No package was downloaded'; exit 1; }
          (( packages == checksums )) || { echo "::error::Found $packages packages but $checksums checksum files"; exit 1; }
          for checksum in *.sha256; do
            sha256sum --check -- "$checksum"
          done

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets"
            gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$TAG" --generate-notes
          fi
