name: Build lefred MariaDB plugin

on:
  workflow_call:
    inputs:
      test_suites:
        description: mtr suite names to run
        required: false
        default: ""
        type: string

      artifact_retention_days:
        description: Number of days to retain workflow artifacts
        required: false
        default: 14
        type: number

      mariadb_versions:
        description: Versions (tarbuldnum or X.Y[.Z]) - whitespace-separated or a JSON array
        required: true
        type: string

      package_formats:
        description: Package formats to produce (deb, rpm, tgz) - whitespace-separated
        required: false
        default: deb rpm tgz
        type: string

      almalinux_version:
        description: AlmaLinux major version used to build the RPM (8, 9 or 10)
        required: false
        default: "9"
        type: string

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      ubuntu_formats: ${{ steps.matrix.outputs.ubuntu_formats }}
      rpm: ${{ steps.matrix.outputs.rpm }}
    steps:
      - id: matrix
        name: Validate MariaDB versions and package formats
        env:
          VERSIONS: ${{ inputs.mariadb_versions }}
          PACKAGE_FORMATS: ${{ inputs.package_formats }}
          ALMALINUX_VERSION: ${{ inputs.almalinux_version }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          raw = os.environ['VERSIONS'].strip()
          versions = json.loads(raw) if raw.startswith('[') else raw.split()
          if not isinstance(versions, list) or not versions or len(versions) > 256:
              raise SystemExit('mariadb_versions must contain 1..256 versions')
          matrix = []
          for version in versions:
              if not isinstance(version, (int, str)):
                  raise SystemExit('mariadb_versions entries must be strings or integers')
              value = str(version)
              if not re.fullmatch(r'[0-9]+|[0-9]+\.[0-9]+(\.[0-9]+)?', value):
                  raise SystemExit('Use autobake build IDs or MariaDB releases such as 1234, 11.4, or 11.8.2')
              row = {'mariadb_version': value}
              if row not in matrix:
                  matrix.append(row)
          formats = os.environ['PACKAGE_FORMATS'].split()
          if not formats or any(f not in ('deb', 'rpm', 'tgz') for f in formats):
              raise SystemExit('package_formats must list deb, rpm and/or tgz')
          if 'rpm' in formats and os.environ['ALMALINUX_VERSION'] not in ('8', '9', '10'):
              raise SystemExit('almalinux_version must be 8, 9 or 10')
          ubuntu_formats = [f for f in ('deb', 'tgz') if f in formats]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': matrix}) + '\n')
              output.write('ubuntu_formats=' + ' '.join(ubuntu_formats) + '\n')
              output.write('rpm=' + str('rpm' in formats).lower() + '\n')
          PYTHON

  build:
    name: deb/tgz - MariaDB ${{ matrix.mariadb_version }}
    needs: versions
    if: ${{ needs.versions.outputs.ubuntu_formats != '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    env:
      MARIADB_VERSION: ${{ matrix.mariadb_version }}
    steps:
      - name: Install the SDK
        run: |
          set -euo pipefail
          if [[ "$MARIADB_VERSION" =~ ^[0-9]+$ ]]; then
            curl --fail --location \
              "https://ci.mariadb.org/$MARIADB_VERSION/amd64-ubuntu-2404-deb-autobake/mariadb.sources" |
              sudo tee /etc/apt/sources.list.d/mariadb.sources >/dev/null
          elif [[ "$MARIADB_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            cat <<EOF | sudo tee /etc/apt/sources.list.d/mariadb.sources >/dev/null
          X-Repolib-Name: MariaDB
          Types: deb
          URIs: https://archive.mariadb.org/mariadb-$MARIADB_VERSION/repo/ubuntu
          Suites: noble
          Trusted: yes
          EOF
          fi
          sudo apt-get update
          sudo apt-get install -y -- libmariadb-dev cmake gcc g++ dpkg-dev file lsb-release

      - name: Check out plugin repository at triggering commit
        uses: actions/checkout@v5
        with:
          path: plugin-source
          submodules: recursive

      - name: Build plugin packages
        env:
          PACKAGE_FORMATS: ${{ needs.versions.outputs.ubuntu_formats }}
        run: |
          set -euo pipefail
          read -ra formats <<< "$PACKAGE_FORMATS"
          mkdir -p dist
          for format in "${formats[@]}"; do
            case "$format" in
              deb) options=(-DDEB=1); pattern='*.deb' ;;
              tgz) options=(); pattern='*.tar.gz' ;;
              *) echo "::error::Unknown package format: $format"; exit 1 ;;
            esac
            echo "::group::Build $format package"
            cmake -S plugin-source -B "build-$format" "${options[@]}"
            cmake --build "build-$format" --target package --parallel
            echo "::endgroup::"
            mapfile -t packages < <(find "build-$format" -maxdepth 1 -type f -name "$pattern")
            (( ${#packages[@]} )) || { echo "::error::No $format package produced"; exit 1; }
            cp -- "${packages[@]}" dist/
          done
          cd dist
          for package in *; do
            sha256sum -- "$package" > "$package.sha256"
          done
          ls -l

      - name: Run MTR using prebuilt runtime
        if: ${{ inputs.test_suites }}
        env:
          TEST_SUITES: ${{ inputs.test_suites }}
        run: |
          set -euo pipefail
          compgen -G 'dist/*.deb' >/dev/null || { echo '::error::MTR needs the deb package format'; exit 1; }
          sudo apt-get install -y ./dist/*.deb
          sudo apt-get install -y mariadb-test mariadb-test-data
          cd /usr/share/mariadb/mariadb-test
          ./mtr --suites "$TEST_SUITES" --force --verbose-restart --retry=1 --vardir="$HOME"/var

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: mariadb-plugin-${{ matrix.mariadb_version }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

  rpm:
    name: rpm (el${{ inputs.almalinux_version }}) - MariaDB ${{ matrix.mariadb_version }}
    needs: versions
    if: ${{ needs.versions.outputs.rpm == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: almalinux:${{ inputs.almalinux_version }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    env:
      MARIADB_VERSION: ${{ matrix.mariadb_version }}
      EL_VERSION: ${{ inputs.almalinux_version }}
    steps:
      - name: Install the SDK
        run: |
          set -euo pipefail
          if [[ "$MARIADB_VERSION" =~ ^[0-9]+$ ]]; then
            curl --fail --location \
              "https://ci.mariadb.org/$MARIADB_VERSION/amd64-rhel-$EL_VERSION-rpm-autobake/MariaDB.repo" \
              > /etc/yum.repos.d/MariaDB.repo
          else
            cat > /etc/yum.repos.d/MariaDB.repo <<EOF
          [MariaDB]
          name=MariaDB $MARIADB_VERSION
          baseurl=https://archive.mariadb.org/mariadb-$MARIADB_VERSION/yum/rhel/$EL_VERSION/x86_64
          gpgcheck=0
          EOF
          fi
          # Let the MariaDB repository override AppStream's mariadb module.
          echo 'module_hotfixes=1' >> /etc/yum.repos.d/MariaDB.repo
          dnf install -y epel-release
          dnf install -y MariaDB-devel cmake gcc gcc-c++ make rpm-build git file

      - name: Check out plugin repository at triggering commit
        uses: actions/checkout@v5
        with:
          path: plugin-source
          submodules: recursive

      - name: Build RPM package
        run: |
          set -euo pipefail
          cmake -S plugin-source -B build-rpm -DRPM=1
          cmake --build build-rpm --target package --parallel
          mkdir -p dist
          mapfile -t packages < <(find build-rpm -maxdepth 1 -type f -name '*.rpm')
          (( ${#packages[@]} )) || { echo '::error::No rpm package produced'; exit 1; }
          cp -- "${packages[@]}" dist/
          cd dist
          for package in *.rpm; do
            sha256sum -- "$package" > "$package.sha256"
            rpm -qpil --requires -- "$package"
          done

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: mariadb-plugin-${{ matrix.mariadb_version }}-el${{ inputs.almalinux_version }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

  release:
    name: Publish GitHub Release
    # deb/tgz and rpm jobs are each optional (package_formats); publish when
    # at least one produced packages and none failed.
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v')
          && (needs.build.result == 'success' || needs.rpm.result == 'success')
          && !contains(needs.*.result, 'failure') }}
    needs:
      - build
      - rpm
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
          pattern: mariadb-plugin-*

      - name: Verify release assets
        run: |
          set -euo pipefail
          cd release-assets
          ls -l
          packages=$(find . -maxdepth 1 -type f ! -name '*.sha256' | wc -l)
          checksums=$(find . -maxdepth 1 -type f -name '*.sha256' | wc -l)
          (( packages > 0 )) || { echo '::error::No package was downloaded'; exit 1; }
          (( packages == checksums )) || { echo "::error::Found $packages packages but $checksums checksum files"; exit 1; }
          for checksum in *.sha256; do
            sha256sum --check -- "$checksum"
          done

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets"
            gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$TAG" --generate-notes
          fi
