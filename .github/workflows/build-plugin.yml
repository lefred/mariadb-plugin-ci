name: Build lefred MariaDB plugin

on:
  workflow_call:
    inputs:
      plugin_name:
        description: Human-readable plugin name used in package names
        required: true
        type: string

      plugin_directory:
        description: Directory name used under MariaDB server/plugin
        required: true
        type: string

      build_target:
        description: CMake target that builds the plugin
        required: true
        type: string

      plugin_library:
        description: Generated shared library filename, for example plugin_name.so
        required: true
        type: string

      cmake_options:
        description: Additional CMake options, for example -DPLUGIN_MY_PLUGIN=DYNAMIC
        required: false
        default: ""
        type: string

      test_suite:
        description: MariaDB Test Runner suite name
        required: false
        default: ""
        type: string

      run_tests:
        description: Run the MTR test suite
        required: false
        default: true
        type: boolean

      package_version:
        description: Version used in package filenames; defaults to tag or commit
        required: false
        default: ""
        type: string

      artifact_retention_days:
        description: Number of days to retain workflow artifacts
        required: false
        default: 14
        type: number

permissions:
  contents: read

jobs:
  build:
    name: MariaDB ${{ matrix.mariadb_version }}

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - mariadb_version: "13.1"
            mariadb_ref: "main"

    steps:
      - name: Check out plugin repository
        uses: actions/checkout@v5
        with:
          path: plugin-source

      - name: Check out MariaDB Server
        uses: actions/checkout@v5
        with:
          repository: MariaDB/server
          ref: ${{ matrix.mariadb_ref }}
          path: mariadb-server
          fetch-depth: 1
          submodules: recursive

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            bison \
            ccache \
            cmake \
            git \
            libaio-dev \
            libboost-dev \
            libboost-program-options-dev \
            libcurl4-openssl-dev \
            libevent-dev \
            libfmt-dev \
            libjudy-dev \
            libncurses-dev \
            libpcre2-dev \
            libreadline-dev \
            libssl-dev \
            libsystemd-dev \
            libxml2-dev \
            libzstd-dev \
            ninja-build \
            pkg-config \
            perl \
            rsync \
            zlib1g-dev

      - name: Display build parameters
        shell: bash
        run: |
          cat <<EOF
          Plugin name:      ${{ inputs.plugin_name }}
          Plugin directory: ${{ inputs.plugin_directory }}
          Build target:     ${{ inputs.build_target }}
          Plugin library:   ${{ inputs.plugin_library }}
          MariaDB version:  ${{ matrix.mariadb_version }}
          MariaDB ref:      ${{ matrix.mariadb_ref }}
          CMake options:    ${{ inputs.cmake_options }}
          Test suite:       ${{ inputs.test_suite }}
          Run tests:        ${{ inputs.run_tests }}
          EOF

      - name: Add plugin to MariaDB source tree
        shell: bash
        run: |
          set -euxo pipefail

          plugin_source="${GITHUB_WORKSPACE}/plugin-source"
          plugin_destination="${GITHUB_WORKSPACE}/mariadb-server/plugin/${{ inputs.plugin_directory }}"

          if [[ ! -f "${plugin_source}/CMakeLists.txt" ]]; then
            echo "::error::The plugin repository does not contain CMakeLists.txt"
            exit 1
          fi

          if [[ -e "${plugin_destination}" ]]; then
            echo "::error::MariaDB already contains ${plugin_destination}"
            exit 1
          fi

          ln -s "${plugin_source}" "${plugin_destination}"

          echo "Plugin link:"
          ls -ld "${plugin_destination}"

      - name: Add plugin test suite to MariaDB
        if: ${{ inputs.run_tests }}
        shell: bash
        run: |
          set -euxo pipefail

          test_suite="${{ inputs.test_suite }}"

          if [[ -z "${test_suite}" ]]; then
            test_suite="${{ inputs.plugin_directory }}"
          fi

          suite_source="${GITHUB_WORKSPACE}/plugin-source/mysql-test/${test_suite}"
          suite_destination="${GITHUB_WORKSPACE}/mariadb-server/mysql-test/suite/${test_suite}"

          if [[ ! -d "${suite_source}" ]]; then
            echo "::error::Plugin test suite not found: ${suite_source}"
            exit 1
          fi

          if [[ -e "${suite_destination}" ]]; then
            echo "::error::MariaDB already contains test suite: ${suite_destination}"
            exit 1
          fi

          ln -s "${suite_source}" "${suite_destination}"

          echo "Test suite link:"
          ls -ld "${suite_destination}"

          echo "Test suite files:"
          find "${suite_source}" -maxdepth 2 -type f -print | sort

      - name: Configure MariaDB
        shell: bash
        run: |
          set -euxo pipefail

          extra_options=()

          if [[ -n "${{ inputs.cmake_options }}" ]]; then
            read -r -a extra_options <<< "${{ inputs.cmake_options }}"
          fi

          cmake \
            -S mariadb-server \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DWITH_UNIT_TESTS=OFF \
            -DWITH_EMBEDDED_SERVER=OFF \
            -DPLUGIN_COLUMNSTORE=NO \
            -DPLUGIN_CONNECT=NO \
            -DPLUGIN_MROONGA=NO \
            -DPLUGIN_ROCKSDB=NO \
            -DPLUGIN_S3=NO \
            -DPLUGIN_SPIDER=NO \
            -DWITH_WSREP=OFF \
            "${extra_options[@]}"

      - name: Add test suite to build tree
        if: ${{ inputs.run_tests }}
        shell: bash
        run: |
          set -euxo pipefail

          test_suite="${{ inputs.test_suite }}"

          if [[ -z "${test_suite}" ]]; then
            test_suite="${{ inputs.plugin_directory }}"
          fi

          suite_source="${GITHUB_WORKSPACE}/plugin-source/mysql-test/${test_suite}"
          suite_destination="${GITHUB_WORKSPACE}/build/mysql-test/suite/${test_suite}"

          if [[ ! -d "${suite_source}" ]]; then
            echo "::error::Test suite source not found: ${suite_source}"
            exit 1
          fi

          mkdir -p "${GITHUB_WORKSPACE}/build/mysql-test/suite"

          rm -rf "${suite_destination}"
          ln -s "${suite_source}" "${suite_destination}"

          ls -ld "${suite_destination}"
          find "${suite_destination}" -maxdepth 2 -type f -print

      - name: Show matching build targets
        shell: bash
        run: |
          set -o pipefail

          cmake --build build --target help |
            grep -i -E \
              "${{ inputs.build_target }}|${{ inputs.plugin_directory }}" ||
            true

      - name: Build plugin
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build build \
            --target "${{ inputs.build_target }}" \
            --parallel "$(nproc)"

      - name: Locate plugin library
        id: locate-plugin
        shell: bash
        run: |
          set -euxo pipefail

          plugin_path="$(
            find build \
              -type f \
              -name "${{ inputs.plugin_library }}" \
              -print \
              -quit
          )"

          if [[ -z "${plugin_path}" ]]; then
            echo "::error::Could not find ${{ inputs.plugin_library }}"

            echo "Shared libraries found in the build directory:"
            find build -type f -name "*.so" -print | sort || true

            exit 1
          fi

          real_plugin_path="$(realpath "${plugin_path}")"

          echo "path=${real_plugin_path}" >> "${GITHUB_OUTPUT}"

          echo "Found plugin library:"
          file "${real_plugin_path}"
          ldd "${real_plugin_path}" || true

      - name: Determine test suite
        if: ${{ inputs.run_tests }}
        id: test-suite
        shell: bash
        run: |
          set -euxo pipefail

          test_suite="${{ inputs.test_suite }}"

          if [[ -z "${test_suite}" ]]; then
            test_suite="${{ inputs.plugin_directory }}"
          fi

          echo "name=${test_suite}" >> "${GITHUB_OUTPUT}"

      - name: Build MTR test infrastructure
        if: ${{ inputs.run_tests }}
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build build \
            --target minbuild resolveip \
            --parallel "$(nproc)"

      - name: Run MTR tests
        if: ${{ inputs.run_tests }}
        shell: bash
        run: |
          set -euxo pipefail

          test_suite="${{ steps.test-suite.outputs.name }}"
          mtr_directory="${GITHUB_WORKSPACE}/build/mysql-test"
          suite_directory="${mtr_directory}/suite/${test_suite}"

          if [[ ! -f "${mtr_directory}/mariadb-test-run.pl" ]]; then
            echo "::error::Out-of-source MTR wrapper not found"
            find build/mysql-test -maxdepth 2 -type f -print || true
            exit 1
          fi

          if [[ ! -d "${suite_directory}" ]]; then
            echo "::error::MTR suite not found: ${suite_directory}"
            exit 1
          fi

          cd "${mtr_directory}"

          perl mariadb-test-run.pl \
            --suite="${test_suite}" \
            --vardir="${RUNNER_TEMP}/mtr-${test_suite}-${{ matrix.mariadb_version }}" \
            --tmpdir="${RUNNER_TEMP}/mtr-tmp-${test_suite}-${{ matrix.mariadb_version }}" \
            --force \
            --retry=1

      - name: Determine package version
        id: package-version
        shell: bash
        run: |
          set -euxo pipefail

          version="${{ inputs.package_version }}"

          if [[ -z "${version}" ]]; then
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              version="${GITHUB_REF_NAME}"
            else
              version="${GITHUB_SHA::12}"
            fi
          fi

          # Keep package filenames predictable.
          version="$(
            printf '%s' "${version}" |
              sed -E 's/[^A-Za-z0-9._+-]+/-/g'
          )"

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Create binary package
        id: package
        shell: bash
        run: |
          set -euxo pipefail

          plugin_name="${{ inputs.plugin_name }}"
          plugin_library="${{ inputs.plugin_library }}"
          mariadb_version="${{ matrix.mariadb_version }}"
          package_version="${{ steps.package-version.outputs.version }}"
          architecture="$(uname -m)"

          safe_plugin_name="$(
            printf '%s' "${plugin_name}" |
              tr '[:upper:]' '[:lower:]' |
              sed -E 's/[^a-z0-9._+-]+/-/g'
          )"

          package_basename="${safe_plugin_name}-${package_version}-mariadb${mariadb_version}-linux-${architecture}"
          package_root="${GITHUB_WORKSPACE}/dist/${package_basename}"

          mkdir -p "${package_root}/lib/mariadb/plugin"
          mkdir -p "${package_root}/share/doc/${safe_plugin_name}"

          install \
            -m 0755 \
            "${{ steps.locate-plugin.outputs.path }}" \
            "${package_root}/lib/mariadb/plugin/${plugin_library}"

          for readme in \
            plugin-source/README \
            plugin-source/README.md \
            plugin-source/README.txt
          do
            if [[ -f "${readme}" ]]; then
              install \
                -m 0644 \
                "${readme}" \
                "${package_root}/share/doc/${safe_plugin_name}/$(basename "${readme}")"
            fi
          done

          for license in \
            plugin-source/LICENSE \
            plugin-source/LICENSE.md \
            plugin-source/COPYING
          do
            if [[ -f "${license}" ]]; then
              install \
                -m 0644 \
                "${license}" \
                "${package_root}/share/doc/${safe_plugin_name}/$(basename "${license}")"
            fi
          done

          cat > "${package_root}/INSTALL.txt" <<EOF
          MariaDB plugin: ${plugin_name}
          Package version: ${package_version}
          MariaDB series: ${mariadb_version}
          Architecture: ${architecture}

          Plugin library:

            lib/mariadb/plugin/${plugin_library}

          Installation
          ------------

          1. Determine the MariaDB plugin directory:

               SELECT @@plugin_dir;

          2. Copy ${plugin_library} into that directory.

          3. Follow the plugin-specific activation instructions from its
             README file.

          This binary was built from the MariaDB ${mariadb_version} source
          branch. Use it with the corresponding MariaDB Server series.
          EOF

          tar \
            -C "${GITHUB_WORKSPACE}/dist" \
            -czf "${GITHUB_WORKSPACE}/dist/${package_basename}.tar.gz" \
            "${package_basename}"

          (
            cd "${GITHUB_WORKSPACE}/dist"

            sha256sum \
              "${package_basename}.tar.gz" \
              > "${package_basename}.tar.gz.sha256"
          )

          echo "basename=${package_basename}" >> "${GITHUB_OUTPUT}"

          echo "Created package:"
          find "${GITHUB_WORKSPACE}/dist" -maxdepth 1 -type f -print

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.basename }}
          path: |
            dist/${{ steps.package.outputs.basename }}.tar.gz
            dist/${{ steps.package.outputs.basename }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

  release:
    name: Publish GitHub Release

    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - build

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download all packages
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Display release assets
        shell: bash
        run: |
          set -euxo pipefail

          find release-assets \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
            sort

          package_count="$(
            find release-assets \
              -maxdepth 1 \
              -type f \
              -name '*.tar.gz' |
              wc -l
          )"

          checksum_count="$(
            find release-assets \
              -maxdepth 1 \
              -type f \
              -name '*.sha256' |
              wc -l
          )"

          if [[ "${package_count}" -lt 1 ]]; then
            echo "::error::No package was downloaded"
            exit 1
          fi

          if [[ "${checksum_count}" -ne "${package_count}" ]]; then
            echo "::error::Found ${package_count} packages but ${checksum_count} checksum files"
            exit 1
          fi

      - name: Verify package checksums
        shell: bash
        run: |
          set -euxo pipefail

          cd release-assets

          for checksum_file in *.sha256
          do
            sha256sum --check "${checksum_file}"
          done

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          tag="${GITHUB_REF_NAME}"

          if gh release view "${tag}" \
               --repo "${GITHUB_REPOSITORY}" \
               >/dev/null 2>&1
          then
            echo "Release ${tag} already exists; replacing its assets"

            gh release upload "${tag}" \
              release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            echo "Creating release ${tag}"

            gh release create "${tag}" \
              release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${tag}" \
              --generate-notes
          fi
