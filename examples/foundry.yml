name: Build and release plugin
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    uses: lefred/mariadb-plugin-ci/.github/workflows/build-plugin-new.yml@main
    with:
      # ci.mariadb.org build IDs (see scripts/find-ci-builds) or releases such as 11.8.2.
      mariadb_versions: |
        77519
        77521
        13.0.2
      package_formats: tgz rpm
      almalinux_version: "10"
      allow_partial_release: true
      # test_suites: my_plugin
